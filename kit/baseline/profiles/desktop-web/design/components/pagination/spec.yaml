use: 표 · 목록 아래, 건이 한 쪽을 넘을 때. 지금 쪽은 aria-current="page"
class: ds-pagination
template: '<nav class="{class}" aria-label="쪽"{attrs}><button class="ds-pagination__item" aria-label="이전">‹</button><button class="ds-pagination__item" aria-current="page">1</button><button class="ds-pagination__item">2</button><button class="ds-pagination__item" aria-label="다음">›</button></nav>'
no-states: true
slots:
  item: { class: ds-pagination__item }
