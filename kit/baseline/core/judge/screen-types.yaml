# 화면 유형 — 화면 한 장이 하는 일. 보편 기준이고, 프로필이 골격(template)을 그 대상에 맞게 바꾼다. 기준 화면을 들이면 이 시스템의 기본값으로 고친다.
#   job(주된 일) · fits(이럴 때) · avoid(이럴 땐 아니다 — 다른 유형) · needs-facts(먼저 확인할 사실)
#   template(HTML 골격 — 출발점) · regions(자리와 채우는 법) · states(그릴 상태 — 상태마다 파일 하나) · primary-action(주 행동)
screenTypes:
  - id: P-list
    title: 목록
    job: 같은 종류의 여러 건을 훑고 하나를 고르거나 다룬다
    fits: [내역 · 사람 · 문서처럼 반복되는 것, 건이 많아 찾기 · 거르기가 필요할 수 있음]
    avoid: [한 건의 내용을 읽기 — P-detail, 숫자 요약이 주인공 — P-overview, 보기만 하는 짧은 정보 — P-detail]
    needs-facts: ['[[F-count]]', '[[F-item-actions]]', '[[F-entry]]', '[[F-empty-cause]]']
    template: layouts/P-list.html
    regions:
      header: 화면 제목 · 오른쪽에 추가 같은 화면 행동(없으면 비움)
      filters: 건이 많을 때만 — 검색 칸([[input]] -search) · [[tabs]]. 적으면 지운다
      main: '[[list]] 또는 [[card]] 묶음([[C-list-card]])'
    states: [기본, 비어 있음, 불러오는 중, 오류]
    primary-action: 추가 · 만들기(있을 때만)
  - id: P-detail
    title: 상세
    job: 한 건의 내용을 읽고, 그 건에 대한 행동을 한다
    fits: [목록에서 하나를 고른 뒤, 정보를 읽는 것이 주인 화면]
    avoid: [고치는 것이 주 — P-form, 여러 건 — P-list]
    needs-facts: ['[[F-edit]]', '[[F-irreversible]]', '[[F-entry]]']
    template: layouts/P-detail.html
    regions:
      header: 뒤로 · 이 건의 이름 · 오른쪽 더보기
      summary: 이 건의 핵심(상태 [[badge]] · 큰 값 하나)
      sections: 이름 ↔ 값의 묶음들 — 묶음 제목 + [[list]](-inset)
      footer: 이 건에 대한 주 행동(있을 때)
    states: [기본, 불러오는 중, 오류]
  - id: P-form
    title: 입력
    job: 값 몇 개를 넣거나 고쳐서 저장 · 제출한다
    fits: [만들기 · 고치기 · 신청, 칸이 열 개 이하]
    avoid: [칸이 많아 나눠야 하면 — P-steps, 켜고 끄는 설정 모음 — P-settings]
    needs-facts: ['[[F-irreversible]]', '[[F-entry]]']
    template: layouts/P-form.html
    regions:
      header: 닫기(또는 뒤로) · 무엇을 하는 화면인지
      main: '[[field]] 들을 [[stack]] -gap-24 로. 묶음이 있으면 묶음 제목'
      footer: 주 행동 하나(저장 · 제출) — 모바일은 아래 고정 -block
    states: [기본, 오류(칸 오류 · 제출 실패), 처리 중]
    primary-action: 저장 · 제출
  - id: P-overview
    title: 현황
    job: 지금 상태를 한눈에 보고 다음 할 일로 들어간다
    fits: [홈 · 대시보드 · 업무의 첫 화면, 숫자 · 진행 · 할 일이 주인공]
    avoid: [건을 다루는 것이 주 — P-list]
    needs-facts: ['[[F-entry]]']
    template: layouts/P-overview.html
    regions:
      header: 화면(업무) 이름 · 오른쪽 내 계정 · 알림
      hero: 가장 중요한 숫자 · 진행 하나([[G-hierarchy]])
      sections: 다음 할 일 · 최근 것 — [[card]] 또는 [[list]], 묶음마다 제목 + 「전체」
    states: [기본, 처음(아무것도 없음), 불러오는 중]
  - id: P-intro
    title: 안내 · 완료
    job: 흐름의 시작이나 끝 — 짧게 알리고 한 행동으로 보낸다
    fits: [시작 전 안내 · 온보딩, 제출 · 결제 완료, 오류로 더 갈 수 없음]
    avoid: [읽을 것이 많으면 — P-detail]
    template: layouts/P-intro.html
    regions:
      main: 가운데 — 그림(있으면) · 제목 한 줄 · 설명 한두 줄
      footer: 행동 하나(다음 · 확인 · 홈으로), 보조는 -ghost 하나까지
    states: [기본]
    primary-action: 다음 · 처음으로
  - id: P-settings
    title: 설정
    job: 켜고 끄기 · 고르기를 바로 반영하며 훑는다
    fits: [알림 · 공개 범위 · 계정 같은 설정 모음]
    avoid: [저장을 눌러야 하는 입력 — P-form]
    template: layouts/P-settings.html
    regions:
      header: 뒤로 · 설정 이름
      main: 묶음 제목 + [[list]] -inset — 줄 끝에 [[switch]] · 지금 값 + -chevron
    states: [기본]
  - id: P-search
    title: 찾기
    job: 말로 찾아 결과 중 하나를 고른다
    fits: [검색 · 사람 찾기 · 주소 찾기]
    template: layouts/P-search.html
    regions:
      header: 검색 칸이 머리 — 취소
      main: 최근 검색(입력 전) · 결과 [[list]](입력 뒤)
    states: [입력 전, 결과, 결과 없음]
  - id: P-steps
    title: 단계
    job: 긴 입력 · 절차를 몇 단계로 나눠 차례로 끝낸다
    fits: [칸이 많은 신청 · 가입 · 설정 마법사]
    avoid: [단계가 하나면 — P-form]
    template: layouts/P-steps.html
    regions:
      header: 닫기 · 제목 · 진행([[progress]] 2 / 5)
      main: 이 단계의 칸들 — 단계 제목 -title-2
      footer: 이전(-ghost) · 다음(주) — 마지막 단계는 「제출」
    states: [기본, 오류, 마지막 단계]
    primary-action: 다음 · 제출
  - id: P-confirm
    title: 확인
    job: 되돌릴 수 없는 행동 직전에 결정을 받는다 — 화면이 아니라 화면 위의 [[dialog]]
    fits: ['[[R-confirm-irreversible]]', 작성 중 나가기]
    template: layouts/P-confirm.html
    regions:
      main: '[[dialog]] — 묻는 말 · 결과 한 줄 · 취소 / 행동 이름'
    states: [기본]
  - id: P-free
    title: 맞는 것이 없을 때
    job: 위 유형 어느 것도 주된 일과 맞지 않을 때 — 화면 틀만 두고 문법으로 짓는다
    fits: [보편 유형에 없는 일(예 — 메뉴판 보기 · 일정표 · 지도)]
    avoid: [가장 가까운 유형을 억지로 빌리기 — 빌릴 거면 그 유형의 fits 에 맞는지 먼저 본다]
    template: layouts/P-free.html
    regions:
      header: 화면 제목(프로필의 머리)
      main: '[[G-hierarchy]] · [[G-spacing-rhythm]] · [[G-grouping]] 로 짓는다. 없는 것은 data-local'
    states: [기본, 비어 있음, 불러오는 중, 오류]
    note: 고른 이유와 「이 시스템에 새 유형이 필요한가」 를 기록에 남긴다 — 같은 일이 두 번 나오면 품질 루프가 새 유형을 제안한다
