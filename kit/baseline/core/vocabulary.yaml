# 어휘 — 컴포넌트가 함께 쓰는 변형 이름. 같은 뜻은 어느 컴포넌트에서든 같은 이름이다(버튼의 -sm 과 입력의 -sm 은 같은 크기 단계).
# 컴포넌트의 props 에 vocab: <이름> 을 달면 값이 여기에 있는지 검사한다. 이름을 바꾸면 모든 컴포넌트가 함께 바뀐다 — 디자이너가 정한다.
vocab:
  intent:
    title: 강도
    how: 얼마나 강하게 말하는가. 화면마다 primary 는 하나.
    values:
      primary: 화면의 주 행동 — 진한 강조 면
      secondary: 보조 행동 — 테두리 또는 옅은 면
      ghost: 가장 약한 행동 — 면 없이 글자 · 아이콘만
      danger: 되돌릴 수 없는 행동(지우기 · 나가기) — 위험 색
  size:
    title: 크기
    how: 컨트롤 높이(size.control)와 글자 단계를 함께 정한다. 모바일의 누르는 것은 md 이상.
    values:
      sm: 작게 — 표 · 목록 줄 안, 조밀한 곳
      md: 기본
      lg: 크게 — 모바일의 주 버튼 · 화면 아래 고정 자리
  tone:
    title: 뜻 색
    how: 상태의 뜻을 색으로 말할 때. 뜻이 없으면 neutral.
    values:
      neutral: 뜻 없음 · 분류
      info: 정보 · 진행 중
      success: 완료 · 정상
      warning: 확인 필요 · 임박
      danger: 오류 · 실패 · 위험
  emphasis:
    title: 면의 세기
    how: 같은 뜻 색을 얼마나 진하게 칠하나. 한 화면에 solid 는 적게.
    values:
      subtle: 옅은 면 + 진한 글자 — 기본
      solid: 진한 면 + 흰 글자 — 가장 중요한 상태 하나
      outline: 테두리만
